name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'packages/api/**'
      - 'packages/shared/**'
      - 'packages/workers/**'
      - '.syncploy/**'
      - '.github/workflows/deploy-backend.yml'
      - 'template.yaml'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build backend application
        run: bun run --filter api build

      - name: Setup Syncploy CLI
        run: |
          git clone --depth 1 https://github.com/harsh-vardhhan/syncploy.git /tmp/syncploy
          cd /tmp/syncploy && bun install
          chmod +x /tmp/syncploy/packages/cli/src/index.ts
          sudo ln -s /tmp/syncploy/packages/cli/src/index.ts /usr/local/bin/syncploy

      - name: Compile Syncploy Infrastructure
        env:
          EHR_TABLE_NAME: ${{ secrets.EHR_TABLE_NAME }}
          DOCUMENTS_BUCKET_NAME: ${{ secrets.DOCUMENTS_BUCKET_NAME }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          API_KEY: ${{ secrets.VITE_API_KEY }}
          OMOPHUB_API_KEY: ${{ secrets.OMOPHUB_API_KEY }}
        run: syncploy build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::479650866443:role/github-actions-deploy-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure Lambda Adapter image is available
        run: |
          aws ecr-public get-login-password --region us-east-1 2>/dev/null | docker login --username AWS --password-stdin public.ecr.aws 2>/dev/null || true
          if ! docker pull public.ecr.aws/awsguru/aws-lambda-adapter:0.8.3; then
            echo "Public ECR pull rate-limited; building local fallback image..."
            mkdir -p /tmp/adapter
            TOKEN=$(curl -s "https://public.ecr.aws/token/" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
            curl -s -L -H "Authorization: Bearer $TOKEN" \
              https://public.ecr.aws/v2/awsguru/aws-lambda-adapter/blobs/sha256:791ef1b0d16f5fc7a194d852da9e87175617f034a299291f34b5bdf1cf6cab04 \
              | tar -xz -C /tmp/adapter/
            chmod +x /tmp/adapter/lambda-adapter
            printf 'FROM scratch\nCOPY lambda-adapter /lambda-adapter\n' > /tmp/adapter/Dockerfile
            docker build -t public.ecr.aws/awsguru/aws-lambda-adapter:0.8.3 /tmp/adapter
          fi

      - name: SAM Build
        run: sam build --no-cached --base-dir . -t .syncploy/template.json

      - name: Recover stack if in rollback failed
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name ehr-annotation-backend --query "Stacks[0].StackStatus" --output text 2>/dev/null || true)
          echo "Current stack status: $STATUS"
          if [ "$STATUS" = "UPDATE_ROLLBACK_FAILED" ]; then
            echo "Stack is in UPDATE_ROLLBACK_FAILED. Calling continue-update-rollback..."
            aws cloudformation continue-update-rollback --stack-name ehr-annotation-backend
            aws cloudformation wait stack-rollback-complete --stack-name ehr-annotation-backend
            echo "Stack recovered to UPDATE_ROLLBACK_COMPLETE."
          fi

      - name: SAM Deploy
        run: |
          sam deploy --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ehr-annotation-backend \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --resolve-image-repos
