name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'packages/api/**'
      - 'packages/shared/**'
      - 'packages/workers/**'
      - '.github/workflows/deploy-backend.yml'
      - 'template.yaml'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build backend application
        run: bun run --filter api build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::479650866443:role/github-actions-deploy-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure Lambda Adapter image is available
        run: |
          aws ecr-public get-login-password --region us-east-1 2>/dev/null | docker login --username AWS --password-stdin public.ecr.aws 2>/dev/null || true
          if ! docker pull public.ecr.aws/awsguru/aws-lambda-adapter:0.8.3; then
            echo "Public ECR pull rate-limited; building local fallback image..."
            mkdir -p /tmp/adapter
            TOKEN=$(curl -s "https://public.ecr.aws/token/" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
            curl -s -L -H "Authorization: Bearer $TOKEN" \
              https://public.ecr.aws/v2/awsguru/aws-lambda-adapter/blobs/sha256:791ef1b0d16f5fc7a194d852da9e87175617f034a299291f34b5bdf1cf6cab04 \
              | tar -xz -C /tmp/adapter/
            chmod +x /tmp/adapter/lambda-adapter
            cat << 'EOF' > /tmp/adapter/Dockerfile
FROM scratch
COPY lambda-adapter /lambda-adapter
EOF
            docker build -t public.ecr.aws/awsguru/aws-lambda-adapter:0.8.3 /tmp/adapter
          fi

      - name: Install esbuild globally
        run: npm install -g esbuild

      - name: SAM Build
        run: sam build --no-cached

      - name: SAM Deploy
        run: |
          sam deploy --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ehr-annotation-backend \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --resolve-image-repos \
            --parameter-overrides \
              DocumentsBucketName=${{ secrets.DOCUMENTS_BUCKET_NAME }} \
              EhrTableName=${{ secrets.EHR_TABLE_NAME }} \
              NotificationEmail=${{ secrets.NOTIFICATION_EMAIL }} \
              EhrApiKeyVal=${{ secrets.VITE_API_KEY }} \
              OmopHubApiKey=${{ secrets.OMOPHUB_API_KEY }} \
              SageMakerModelDataUrl=s3://${{ secrets.DOCUMENTS_BUCKET_NAME }}/models/gliner-relex/model-base-v1.0.tar.gz \
              DdosRequestThreshold=15000
